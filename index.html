<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>팡팡! 모바일 숫자 풍선</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        /* 모바일 전체 화면 설정 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Jua', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* 상중하 배치 */
            height: 100vh;
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
            background: radial-gradient(circle, #e0f7fa 0%, #b2ebf2 100%);
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 상단 입력 영역 */
        .top-ui {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .input-group {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        input {
            padding: 12px;
            font-size: 20px; /* 모바일에서 가독성 높임 */
            border: 2px solid #4db6ac;
            border-radius: 10px;
            width: 80px;
            text-align: center;
            font-family: 'Jua', sans-serif;
        }

        button {
            padding: 12px 20px;
            font-size: 20px;
            background: linear-gradient(135deg, #00bfa5, #00796b);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
        }

        /* 직전 숫자 알림판 (더 크게) */
        #lastNumberContainer {
            height: 50px;
            font-size: 22px;
            color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 30px;
            padding: 0 25px;
            border: 3px solid #ff5252;
            visibility: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #lastNumber { color: #ff5252; font-size: 32px; margin-left: 10px; }

        /* 중앙 게임 영역 */
        #stage {
            flex-grow: 1; /* 남은 공간 차지 */
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
        }

        /* 풍선 크기 확대 */
        #balloon {
            position: absolute;
            width: 180px; /* 더 크게 변경 */
            height: 220px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
            box-shadow: inset -15px -25px 30px rgba(0,0,0,0.2), 5px 15px 25px rgba(0,0,0,0.1);
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.02); }
        }

        #balloon::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid var(--b-color);
        }

        /* 숫자 표시 (아주 크게) */
        #numberDisplay {
            font-size: 150px;
            font-weight: bold;
            color: #2c3e50;
            text-shadow: 4px 4px 0px #fff;
            opacity: 0;
            z-index: 1;
            margin: 0;
        }

        #numberDisplay.show {
            animation: numberPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes numberPop {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 파편 효과 */
        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>

<div class="top-ui">
    <div class="input-group">
        <input type="number" id="maxInput" min="1" value="20" pattern="\d*">
        <button onclick="setup()">시작</button>
    </div>
    <div id="lastNumberContainer">직전 숫자: <span id="lastNumber">-</span></div>
</div>

<div id="stage">
    <div id="balloon" onclick="popBalloon()"></div>
    <h1 id="numberDisplay">0</h1>
</div>

<div style="height: 50px;"></div> <script>
    let numberList = [];
    let currentIndex = 0;
    let maxNum = 0;
    let isAnimating = false;
    let previousNum = null;

    const colors = ['#FF5252', '#FF4081', '#E040FB', '#7C4DFF', '#536DFE', '#448AFF', '#40C4FF', '#18FFFF', '#64FFDA', '#B2FF59', '#EEFF41', '#FFFF00', '#FFD740', '#FFAB40', '#FF6E40'];

    function setup() {
        maxNum = parseInt(document.getElementById('maxInput').value);
        if (isNaN(maxNum) || maxNum <= 0) return;
        
        // 키보드 숨기기 (포커스 해제)
        document.activeElement.blur();
        
        resetList();
        previousNum = null;
        document.getElementById('lastNumberContainer').style.visibility = "hidden";
        document.getElementById('stage').style.visibility = "visible";
        prepareNewBalloon();
    }

    function resetList() {
        numberList = Array.from({length: maxNum}, (_, i) => i + 1);
        for (let i = numberList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [numberList[i], numberList[j]] = [numberList[j], numberList[i]];
        }
        currentIndex = 0;
    }

    function prepareNewBalloon() {
        isAnimating = false;
        const display = document.getElementById('numberDisplay');
        const balloon = document.getElementById('balloon');
        
        display.classList.remove('show');
        balloon.style.display = 'block';
        
        const color = colors[Math.floor(Math.random() * colors.length)];
        balloon.style.backgroundColor = color;
        balloon.style.setProperty('--b-color', color);

        if (previousNum !== null) {
            document.getElementById('lastNumber').innerText = previousNum;
            document.getElementById('lastNumberContainer').style.visibility = "visible";
        }
    }

    function popBalloon() {
        if (isAnimating) return;
        isAnimating = true;

        if (currentIndex >= numberList.length) resetList();

        const result = numberList[currentIndex];
        const balloon = document.getElementById('balloon');
        const display = document.getElementById('numberDisplay');

        // 터치 위치 고려한 파편 생성
        createFirework(balloon.offsetLeft + (balloon.offsetWidth/2), balloon.offsetTop + (balloon.offsetHeight/2), balloon.style.backgroundColor);
        
        balloon.style.display = 'none';
        display.innerText = result;
        display.classList.add('show');

        currentIndex++;
        previousNum = result;

        setTimeout(prepareNewBalloon, 700); // 모바일은 더 빠르게!
    }

    function createFirework(x, y, color) {
        const stage = document.getElementById('stage');
        for (let i = 0; i < 35; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.backgroundColor = i % 2 === 0 ? color : colors[Math.floor(Math.random()*colors.length)];
            confetti.style.left = x + 'px';
            confetti.style.top = y + 'px';
            confetti.style.borderRadius = '50%';
            
            stage.appendChild(confetti);

            const angle = Math.random() * Math.PI * 2;
            const velocity = 5 + Math.random() * 10;
            const tx = Math.cos(angle) * velocity * 12;
            const ty = Math.sin(angle) * velocity * 12 + 80;

            confetti.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
            ], {
                duration: 700,
                easing: 'ease-out',
                fill: 'forwards'
            });

            setTimeout(() => confetti.remove(), 800);
        }
    }
</script>

</body>
</html>
